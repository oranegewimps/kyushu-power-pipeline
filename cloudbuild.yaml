# イメージをビルドして Artifact Registry に push する
# 使い方: gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=<git sha> ...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - .
images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest
substitutions:
  _IMAGE: asia-northeast1-docker.pkg.dev/${PROJECT_ID}/pipeline/pipeline
  _TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true # _IMAGE の中で ${PROJECT_ID} を展開するため
