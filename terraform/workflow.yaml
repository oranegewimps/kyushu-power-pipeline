main:
  steps:
    - run_ingestion:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: projects/${project}/locations/${region}/jobs/ingestion
        result: ingestion_result
    - run_dbt:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: projects/${project}/locations/${region}/jobs/dbt-build
        result: dbt_result
    - run_reconcile:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: projects/${project}/locations/${region}/jobs/reconcile
        result: reconcile_result
    - done:
        # ジョブの実行結果（Execution）から、実行名と成功タスク数だけを返す
        return:
          ingestion: $${ingestion_result.metadata.name + " succeeded=" + string(map.get(ingestion_result.metadata, "succeededCount"))}
          dbt: $${dbt_result.metadata.name + " succeeded=" + string(map.get(dbt_result.metadata, "succeededCount"))}
          reconcile: $${reconcile_result.metadata.name + " succeeded=" + string(map.get(reconcile_result.metadata, "succeededCount"))}
